name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller scapy

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed Final.py
        copy wordlist.txt dist\Final\
        copy handshake.cap dist\Final\
        copy hashes.txt dist\Final\
        copy sample_rainbow_table.json dist\Final\
        copy README.md dist\Final\
        
    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: QuickCrack-Windows
        path: dist/Final/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuickCrack-Windows
          path: QuickCrack-Windows

      - name: Zip the build
        run: zip -r QuickCrack-Windows.zip QuickCrack-Windows/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: QuickCrack-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
